[tool.poetry]
name = "mlpie"
version = "0.1.0"
description = "MLPie - MLOps Platform Backend"
authors = ["Your Name <you@example.com>"] # TODO: Update Author
readme = "README.md"
packages = [{include = "mlpie", from = "."}] # Point to the backend package

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.111.1"
uvicorn = {extras = ["standard"], version = "^0.30.3"} # Uvicorn with standard dependencies
# gunicorn = "^22.0.0" # Add Gunicorn if needed for production deployment
pydantic = "^2.8.2"
pydantic-settings = "^2.3.4" # For settings management
sqlalchemy = {extras = ["asyncio"], version = "^2.0.31"} # SQLAlchemy with asyncio support
# sqlmodel = "^0.0.19" # Alternative to SQLAlchemy + Pydantic models
alembic = "^1.13.2" # For database migrations
asyncpg = "^0.30.0" # Async PostgreSQL driver (if using PostgreSQL)
# pysqlite3-binary = "^0.5.3" # If using SQLite, sometimes needed on specific systems
gitpython = "^3.1.43" # For Git interaction
# pluggy = "^1.5.0" # If using Pluggy for plugins
typer = {extras = ["all"], version = "^0.12.3"} # For CLI (Typer recommended with FastAPI)
httpx = "^0.27.0" # For the API client in the CLI
python-dotenv = "^1.0.1" # To load .env files
cryptography = "^42.0.8" # For encrypting secrets
jsonschema = "^4.22.0" # For validating plugin configurations
aiosqlite = "^0.20.0"
apscheduler = "~3.11" # Using stable v3
greenlet = "^3.0.3" # Potentially needed for SQLAlchemy async/sync context
# Data processing and profiling dependencies
pandas = "^2.2.1"
numpy = "^1.26.4"
# Optional: PySpark for large data profiling
# pyspark = "^3.5.1"


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
pytest-asyncio = "^0.23.7" # For testing async code
mypy = "^1.11.0"
ruff = "^0.5.5" # Linter/Formatter
pytest-cov = "^6.1.1"

[tool.poetry.scripts]
mlpie-api = "mlpie.api.main:app" # Allows running uvicorn mlpie.api.main:app
mlpie-cli = "mlpie.cli.main:app" # Entry point for the CLI

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I", "UP", "C4", "B", "A", "RUF"]
ignore = ["E501"] # Handled by line-length

[tool.ruff.lint.isort]
known-first-party = ["mlpie"]

[tool.mypy]
packages = ["mlpie"]
strict = true 