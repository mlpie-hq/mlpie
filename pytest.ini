[pytest]
# Use asyncio as the test runner for async tests
asyncio_mode = auto

# Test file patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Verbose output for test results
addopts = -v

# Directories that are not searched for tests
norecursedirs = .* venv build dist node_modules ui

# Display information during test collection and execution
log_cli = true
log_cli_level = INFO

# Test markers
markers =
    slow: Tests that take a long time to run
    integration: Integration tests that require external services
    unit: Unit tests that do not require external services

# Coverage settings
[coverage:run]
source = mlpie
omit =
    */tests/*
    */migrations/*
    */alembic/*
    */settings.py
    */__main__.py
    */setup.py
    */.venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    def __str__
    raise NotImplementedError
    if __name__ == .__main__.:
    pass
    raise ImportError
    except ImportError
    raise ValueError
    raise TypeError 